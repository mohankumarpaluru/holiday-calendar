    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "var(--background)",
              foreground: "var(--foreground)",
            },
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --font-sans: "Geist", "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "Geist Mono", "Roboto Mono", monospace;

        /* Locked Color Palette */
        --bg-dark: #071225;

        --card-bg-light: #FFFFFF;
        --card-bg-dark: rgba(255,255,255,0.03);

        --text-dark: #0f1724;

        /* Navbar Backgrounds */
        --navbar-bg-light: rgba(255,255,255,0.92);
        --navbar-bg-dark: rgba(10,16,28,0.86);

        /* Shine Border Colors (Light Mode) */
        --shine-c1: rgba(156,64,255,0.65);
        --shine-c2: rgba(64,179,255,0.65);
        --shine-c3: rgba(255,190,123,0.55);

        /* Border Beam Colors */
        --beam-from: rgba(156,64,255,0.12);
        --beam-to: rgba(64,179,255,0.10);
      }

      .dark {
        /* Shine Border Colors (Dark Mode) */
        --shine-c1: rgba(156,64,255,0.9);
        --shine-c2: rgba(64,179,255,0.85);
        --shine-c3: rgba(160,124,254,0.8);
      }

      /* Animation Definitions */
      @keyframes shine {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes border-beam {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
      }

      /* Shine Border - Robust Implementation */
      .shine-border {
        position: relative;
        display: inline-block;
        --border-radius: 12px;
        --border-width: 1.2px;
        --duration: 14s;
      }

      .shine-border .shine-layer {
        position: absolute;
        inset: 0;
        z-index: 20; /* Sit ABOVE content to ensure visibility */
        border-radius: var(--border-radius);
        pointer-events: none;

        /* Gradient uses CSS vars that switch based on theme */
        background-image: linear-gradient(90deg, var(--shine-c1), var(--shine-c2), var(--shine-c3), var(--shine-c1));
        background-size: 300% 100%;
        animation: shine var(--duration) linear infinite;

        /* Mask to create border stroke */
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;

        padding: var(--border-width);
        box-sizing: border-box;
      }

      /* BorderBeam - Ambient Background Separator */
      .border-beam {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background-image: linear-gradient(90deg, var(--beam-from), var(--beam-to), var(--beam-from));
        background-size: 200% 100%;
        animation: border-beam 18s linear infinite;
        opacity: 0.28;
        z-index: 0; /* Behind content */
      }

      /* Layout Helpers */
      .card-content {
        position: relative;
        z-index: 10;
        background: var(--card-bg-light);
      }
      .dark .card-content {
        background: var(--card-bg-dark);
      }

      /* Base Styles */
      body {
        font-family: var(--font-sans);
        background-color: #f9fafb;
        color: var(--text-dark);
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow-x: hidden;
      }

      .dark body {
        background-color: var(--bg-dark);
        color: #e6eef8;
      }

      .font-mono {
        font-family: var(--font-mono);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
    </style>

</script>
